name: Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension contents
        run: npm run validate

      - name: Package VSIX
        run: npm run vsix -- --out zeco-theme.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeco-theme-vsix-${{ github.sha }}
          path: zeco-theme.vsix
          if-no-files-found: error

