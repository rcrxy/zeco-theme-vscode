name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions
        id: version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}." >&2
            exit 1
          fi

          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "vsix_path=zeco-theme-${package_version}.vsix" >> "${GITHUB_OUTPUT}"

      - name: Validate extension contents
        run: npm run validate

      - name: Package VSIX
        run: npm run vsix -- --out "${{ steps.version.outputs.vsix_path }}"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:marketplace -- --packagePath "${{ steps.version.outputs.vsix_path }}" --pat "${VSCE_PAT}" --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${{ steps.version.outputs.vsix_path }}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${{ steps.version.outputs.vsix_path }}" \
              --verify-tag \
              --title "Zeco Theme ${{ steps.version.outputs.package_version }}" \
              --generate-notes
          fi
